version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    groups:
      production-patches:
        dependency-type: production
        update-types:
          - patch
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
